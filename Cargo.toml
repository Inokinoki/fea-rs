[package]
name = "fea"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Finite Element Analysis (FEA) methods and visualization utilities in Rust"
repository = "https://github.com/Inokinoki/fea-rs"
readme = "README.md"

[dependencies]
anyhow = "1"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

[features]
# Default features - standard analysis capabilities
default = ["static", "modal", "solver-direct", "element-truss"]

# Analysis types
static = []
modal = []
buckling = []
dynamic = ["modal"]
harmonic = ["modal"]

# Solvers
solver-direct = []
solver-iterative = []
solver-eigen = []

# Elements
element-truss = []
element-beam = []
element-plate = []
element-solid = []

# Nonlinear analysis
nonlinear-geometric = []
nonlinear-material = []

# Full feature sets
minimal = ["static", "solver-direct", "element-truss"]
standard = ["static", "modal", "solver-direct", "solver-iterative", "element-truss", "element-beam"]
full = ["static", "modal", "buckling", "dynamic", "solver-direct", "solver-iterative", "solver-eigen", "element-truss", "element-beam", "element-plate", "nonlinear-geometric"]
